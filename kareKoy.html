<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kare Köy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: full-screen isometric island on canvas; light minimal HUD floats on top; round icon buttons at the bottom; panels slide up as sheets. Single sunny look by choice (the game has its own day/night). */
:root{
  --ink:#4a2c12; --muted:#8a6a45; --panel:rgba(255,253,248,.96); --line:#e3d2b4; --soft:#f3ead8;
  --leaf:#5aa83a; --leaf-dk:#3d7f25; --gold:#f4b829; --red:#e0553f; --sea:#5ec2dd;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--font);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.e{font-family:var(--emoji);line-height:1}

.hud{position:fixed;z-index:10;top:calc(8px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px 3px 6px;box-shadow:0 2px 6px rgba(60,35,10,.12);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;height:32px;box-sizing:border-box}
.pill .e{font-size:17px}
.res{display:flex;align-items:center;gap:3px}
.lv{width:22px;height:22px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:12px}
.xpbar{width:54px;height:7px;border-radius:9px;background:#eadfc8;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--leaf)}
.time{flex-direction:column;align-items:flex-start;gap:0;height:auto;padding:2px 12px 2px 8px;line-height:1.05}
.time small{font-size:11px;color:var(--muted);font-weight:600}
.spacer{flex:1}
.rbtn{pointer-events:auto;width:48px;height:48px;border-radius:50%;background:var(--panel);border:1.5px solid var(--line);box-shadow:0 2px 6px rgba(60,35,10,.14);display:grid;place-items:center;position:relative;flex:none}
.rbtn .e{font-size:24px}
.rbtn:active{transform:scale(.94)}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.bar{position:fixed;z-index:10;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.acts{display:flex;gap:8px}
.cap{pointer-events:none;position:absolute;left:38px;bottom:-2px;background:#fff;border:1.5px solid var(--line);border-radius:9px;font-size:11px;padding:0 6px;white-space:nowrap}

.sheet{position:fixed;z-index:30;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);max-height:min(78vh,620px);display:flex;flex-direction:column;background:var(--panel);border:1.5px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(60,35,10,.18);transition:transform .25s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:translate(-50%,0)}
@media (min-width:900px) and (orientation:landscape){.sheet{left:auto;right:12px;bottom:12px;top:12px;max-height:none;transform:translateX(110%);border-radius:22px;border:1.5px solid var(--line)}.sheet.open{transform:none}}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.shead h2{margin:0;font-size:20px;flex:1}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:16px}
.tabs{display:flex;gap:6px;padding:4px 14px 8px;overflow-x:auto}
.tabs button{flex:1;min-width:52px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.tabs button .e{font-size:20px}
.tabs button[aria-selected="true"]{background:var(--leaf)}
.sbody{overflow:auto;padding:4px 14px 16px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sec{font-size:14px;color:var(--muted);margin:6px 2px 0}
.hint{font-size:13px;color:var(--muted);font-weight:600;margin:0;line-height:1.3}
.row{display:flex;align-items:center;gap:10px;background:#fbf6ec;border:1px solid #efe4d0;border-radius:14px;padding:8px}
.disc{width:44px;height:44px;border-radius:50%;background:#f1e8d6;display:grid;place-items:center;flex:none}
.disc .e{font-size:24px}
.txt{flex:1;min-width:0}
.t1{font-size:15px;line-height:1.15}
.t2{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.btn{background:var(--leaf);color:#fff;border-radius:12px;padding:7px 12px;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.btn:active{background:var(--leaf-dk)}
.btn[disabled]{background:#d8ccb4;color:#fff;cursor:not-allowed}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.red{background:var(--red)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.chip{display:flex;align-items:center;gap:3px;background:#fff;border:1px solid #efe4d0;border-radius:10px;padding:1px 7px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.ok{background:#e4f3d8;color:var(--leaf-dk)}
.prog{height:8px;border-radius:9px;background:#eadfc8;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--leaf)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(30,18,6,.42);display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border-radius:22px;border:1.5px solid var(--line);width:min(440px,100%);max-height:88vh;overflow:auto;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:20px;flex:1}
.ch{display:flex;align-items:center;gap:10px}
.crops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crop{background:#fff;border:1.5px solid #efe4d0;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.crop .e{font-size:34px}
.crop[disabled]{opacity:.45}
.water{position:relative;height:130px;border-radius:16px;background:linear-gradient(#7fd0ea,#4fa6c9);overflow:hidden}
.bob{position:absolute;left:50%;top:50%;width:22px;height:30px;margin:-15px 0 0 -11px}
.bob::before{content:"";position:absolute;inset:8px 0 0;border-radius:50%;background:linear-gradient(#e0553f 50%,#fff 50%);box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.bob::after{content:"";position:absolute;left:10px;top:0;width:2px;height:10px;background:#3a2a20}
.ripple{position:absolute;left:50%;top:58%;width:60px;height:20px;margin-left:-30px;border:2px solid rgba(255,255,255,.6);border-radius:50%;animation:rip 1.6s infinite}
@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:#fff;border:1.5px solid #efe4d0;border-radius:12px;text-align:center;padding:6px 2px;font-size:12px}
.day.cur{background:var(--gold);border-color:var(--gold)}
.day.past{opacity:.45}

.toast{position:fixed;z-index:60;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);opacity:0;transition:.22s;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none;box-shadow:0 4px 14px rgba(60,35,10,.15)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.selbtn{position:fixed;z-index:20;transform:translate(-50%,-100%);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px 12px;box-shadow:0 4px 14px rgba(60,35,10,.18);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(rgba(20,40,30,.15),rgba(20,40,30,.35));color:#fff;text-align:center;padding:20px}
.title h1{margin:0;font-size:clamp(46px,12vw,84px);line-height:1;text-shadow:0 3px 0 #6e4a2a,0 0 14px rgba(0,0,0,.25);letter-spacing:.01em}
.title p{margin:0;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.title .deco{display:flex;gap:14px;font-size:34px}
.title .deco span{animation:hop 1.6s ease-in-out infinite}
.title .deco span:nth-child(2){animation-delay:.2s}.title .deco span:nth-child(3){animation-delay:.4s}.title .deco span:nth-child(4){animation-delay:.6s}.title .deco span:nth-child(5){animation-delay:.8s}
@keyframes hop{50%{transform:translateY(-8px)}}
.play{margin-top:14px;background:var(--leaf);color:#fff;font-size:26px;border-radius:18px;padding:10px 54px;box-shadow:0 4px 0 var(--leaf-dk)}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-dk)}
.title small{opacity:.85;font-weight:600}
@media (max-width:560px){.pill{font-size:13px;padding:2px 9px 2px 5px;height:28px}.pill .e{font-size:15px}.xpbar{width:36px}.rbtn{width:44px;height:44px}.rbtn .e{font-size:22px}.acts{gap:6px}.hide-sm{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="cv"></canvas>

<div class="hud" id="hud">
  <div class="pill"><span class="res"><span class="e">🪙</span><span id="coins">0</span></span><span class="res"><span class="e">🪵</span><span id="wood">0</span></span><span class="res"><span class="e">🪨</span><span id="stone">0</span></span></div>
  <div class="pill"><span class="lv" id="lvl">1</span><span class="xpbar"><i id="xp"></i></span></div>
  <div class="pill time hide-sm" id="timepill"><span id="season">İlkbahar</span><small id="phase">Gündüz</small></div>
  <div class="spacer"></div>
  <button class="rbtn" id="btnSettings" aria-label="Ayarlar"><span class="e">⚙️</span></button>
</div>

<div class="bar">
  <button class="rbtn" id="btnBarn" aria-label="Ambar" style="pointer-events:auto"><span class="e">🏚️</span><span class="cap" id="capchip">0/40</span></button>
  <div class="acts" style="pointer-events:auto">
    <button class="rbtn" data-tab="shop" aria-label="Mağaza"><span class="e">🏪</span></button>
    <button class="rbtn" data-tab="orders" aria-label="Görevler"><span class="e">📋</span><span class="badge" id="bOrders" hidden></span></button>
    <button class="rbtn" data-tab="market" aria-label="Pazar"><span class="e">💰</span></button>
    <button class="rbtn" data-tab="daily" aria-label="Günlük"><span class="e">🎁</span><span class="badge" id="bDaily" hidden></span></button>
    <button class="rbtn" data-tab="ach" aria-label="Başarımlar"><span class="e">🏆</span><span class="badge" id="bAch" hidden></span></button>
  </div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="shead"><span class="e" id="sIcon" style="font-size:24px">🏪</span><h2 id="sTitle">Mağaza</h2><button class="x" id="sClose" aria-label="Kapat">✕</button></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="shop" aria-label="Mağaza"><span class="e">🏪</span></button>
    <button role="tab" data-tab="orders" aria-label="Görevler"><span class="e">📋</span></button>
    <button role="tab" data-tab="market" aria-label="Pazar"><span class="e">💰</span></button>
    <button role="tab" data-tab="daily" aria-label="Günlük"><span class="e">🎁</span></button>
    <button role="tab" data-tab="ach" aria-label="Başarımlar"><span class="e">🏆</span></button>
    <button role="tab" data-tab="barn" aria-label="Ambar"><span class="e">🏚️</span></button>
  </div>
  <div class="sbody" id="sbody"></div>
</div>

<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>
<div id="selbtn" class="selbtn" hidden></div>
<div class="toast" id="toast"></div>

<div class="title" id="title">
  <div class="deco e"><span>🌾</span><span>🥚</span><span>🐄</span><span>🐟</span><span>🐱</span></div>
  <h1>Kare Köy</h1>
  <p>küçük çiftliğini kur, köyünü büyüt</p>
  <button class="play" id="play">Oyna</button>
  <small id="tinfo"></small>
  <small>web prototipi · v0.9 · telefonu yan çevirince daha rahat</small>
</div>

/* ---------------- durum ---------------- */
let S;
function fresh(){
  return {ver:9,coins:60,xp:0,cap:40,nid:4,wood:10,stone:5,inv:Object.assign(new Array(NI).fill(0),{0:4}),
    plots:['0,0','1,0','0,1'],
    b:[{id:1,type:'tarla',x:0,y:2,st:0,end:0,dur:0,crop:0,lvl:1},{id:2,type:'kumes',x:2,y:0,st:0,end:0,dur:0},{id:3,type:'ev',x:4,y:0,lvl:1,st:0}],
    orders:[],npc:[],npcAt:0,debris:[],nextDebris:0,daily:[],dailyDate:'',lastDaily:'',streak:0,
    boat:{st:0,at:0,crates:[]},stats:new Array(12).fill(0),achC:[],achSeen:[],catFed:0,catMet:false,muted:false};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);if(S&&S.plots){S.inv.length=NI;for(let i=0;i<NI;i++)S.inv[i]=S.inv[i]||0;return true}}}catch(e){}S=fresh();return false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------------- yardımcılar ---------------- */
const now=()=>Date.now();
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const lvl=()=>{let l=1;LV.forEach((x,i)=>{if(S.xp>=x)l=i+1});return l};
const total=()=>S.inv.reduce((a,b)=>a+b,0);
const sum=a=>a.reduce((x,y)=>x+y,0);
const has=a=>a.every((v,i)=>S.inv[i]>=v);
const take=a=>a.forEach((v,i)=>S.inv[i]-=v);
const give=a=>a.forEach((v,i)=>S.inv[i]+=v);
const fmt=a=>a.map((v,i)=>v?v+' '+ITEMS[i].e:'').filter(Boolean).join(' ');
const pkey=(x,y)=>x+','+y;
const fdiv=(a,b)=>Math.floor(a/b);
const parse=k=>k.split(',').map(Number);
const hash=(x,y,s=0)=>{const v=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return v-Math.floor(v)};
function addXP(n){const b=lvl();S.xp+=n;const a=lvl();if(a>b){toast('🎉 Seviye '+a+'!');sfx('unlock');fillOrders()}}
function stat(k,n){if(n>0)S.stats[ST[k]]=(S.stats[ST[k]]||0)+n}

/* ---------------- arazi kuralları ---------------- */
const isBeach=(px,py)=>px+py>=1, isSea=(px,py)=>px+py>=2;
const unlocked=(x,y)=>S.plots.includes(pkey(fdiv(x,P),fdiv(y,P)));
function revealed(){const set=new Set();for(const k of S.plots){set.add(k);const[px,py]=parse(k);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const nx=px+dx,ny=py+dy;if(Math.abs(nx)<=MAXP&&Math.abs(ny)<=MAXP&&!isSea(nx,ny))set.add(pkey(nx,ny))}}return set}
let REV=new Set();
const plotCost=()=>{const n=S.plots.length-3;return Math.max(80,80+n*70+n*n*10)};
function canPlace(b,x,y){const d=B[b.type];for(let i=0;i<d.w;i++)for(let j=0;j<d.h;j++)if(!unlocked(x+i,y+j))return false;
  for(const o of S.b){if(o.id===b.id)continue;const od=B[o.type];if(x<o.x+od.w&&x+d.w>o.x&&y<o.y+od.h&&y+d.h>o.y)return false}
  for(const r of S.debris)if(r.x>=x&&r.x<x+d.w&&r.y>=y&&r.y<y+d.h)return false;return true}
function cellBlocked(x,y,walk){for(const b of S.b){const d=B[b.type];if(walk&&d.flat)continue;if(x>=b.x&&x<b.x+d.w&&y>=b.y&&y<b.y+d.h)return true}for(const r of S.debris)if(r.x===x&&r.y===y)return true;return false}
function freeCells(){const l=[];for(const k of S.plots){const[px,py]=parse(k);for(let x=0;x<P;x++)for(let y=0;y<P;y++){const cx=px*P+x,cy=py*P+y;if(!cellBlocked(cx,cy))l.push([cx,cy])}}return l}
function near(b,type){const d=B[b.type];return S.b.some(o=>{if(o.id===b.id||o.type!==type)return false;const od=B[o.type];return o.x<=b.x+d.w&&o.x+od.w>=b.x&&o.y<=b.y+d.h&&o.y+od.h>=b.y})}
function wellFields(w){const l=S.b.filter(o=>o.type==='tarla'&&o.x<w.x+3&&o.x+2>w.x-2&&o.y<w.y+3&&o.y+2>w.y-2);l.sort((a,b)=>Math.hypot(a.x+1-w.x-.5,a.y+1-w.y-.5)-Math.hypot(b.x+1-w.x-.5,b.y+1-w.y-.5));return l.slice(0,4)}
const wellBoost=f=>S.b.some(w=>w.type==='kuyu'&&wellFields(w).includes(f));
function bonus(b){const d=B[b.type];let f=1;if(d.kind==='crop'){if(wellBoost(b))f*=.7;if(near(b,'kovan'))f*=.8;f*=seasonFactor()}if(d.near&&near(b,d.near))f*=.75;return f}
function outOf(b){const d=B[b.type];if(d.kind!=='crop')return d.outp;const c=CROPS[b.crop||0];const a=new Array(NI).fill(0);a[c.item]=c.amount*((b.lvl||1)>=2?2:1);return a}
function producible(){const set=new Set();const own=new Set(S.b.map(b=>b.type));const l=lvl();if(own.has('tarla'))CROPS.forEach(c=>{if(c.lvl<=l)set.add(c.item)});if(l>=2)set.add(BALIK);
  let ch=true;while(ch){ch=false;for(const[k,d]of Object.entries(B)){if(!own.has(k)||d.kind==='crop'||d.kind==='decor'||d.kind==='home')continue;if(d.inp.some((v,i)=>v&&!set.has(i)))continue;d.outp.forEach((v,i)=>{if(v&&!set.has(i)){set.add(i);ch=true}})}}return set}
const home=()=>S.b.find(b=>b.type==='ev');
const homeLvl=()=>{const h=home();return h?Math.max(1,h.lvl||1):0};

/* ---------------- eylemler ---------------- */
function tapBuilding(b){const d=B[b.type];bounce(b);
  if(d.kind==='home'){openHome();return}
  if(d.kind==='decor'){if(b.type==='kuyu'){wellShow={b,t:performance.now()};toast('💧 Kuyu '+wellFields(b).length+'/4 tarlayı suluyor (%30 hızlı)')}else toast(d.e+' '+d.n);sfx('tap');return}
  if(d.kind==='crop'&&b.st===0){openCropPicker(b);return}
  const voice={kumes:'tavuk',ahir:'inek',agil:'koyun',kovan:'ari'}[b.type];if(voice)playAnimal(voice);
  if(b.st===0){if(!has(d.inp)){toast('Yetmiyor: '+fmt(d.inp));sfx('err');return}take(d.inp);b.dur=d.t*bonus(b);b.end=now()+b.dur*1000;b.st=1;sfx('plant');save();refresh()}
  else if(b.st===1){toast(d.e+' '+mmss((b.end-now())/1000)+' kaldı');sfx('tap')}
  else harvest(b)}
function harvest(b){const d=B[b.type];const o=outOf(b);if(total()+sum(o)>S.cap){toast('Ambar dolu! Pazarda sat ya da büyüt.');sfx('err');return}
  give(o);o.forEach((v,i)=>{if(v)trackDaily('collect',i,v)});if(d.kind==='crop')stat('harvest',1);stat('egg',o[YUM]);stat('milk',o[SUT]);
  addXP(o.reduce((a,v,i)=>a+v*ITEMS[i].xp,0));b.st=0;floatText(b.x+d.w/2,b.y+d.h/2,'+'+fmt(o));sfx('pop');save();refresh()}
function plantCrop(b,ci){const c=CROPS[ci];if(c.lvl>lvl()){toast(ITEMS[c.item].n+' seviye '+c.lvl+'\'te açılır');return}
  b.crop=ci;b.dur=c.t*bonus(b);b.end=now()+b.dur*1000;b.st=1;trackDaily('plant',0,1);toast(ITEMS[c.item].e+' ekildi!');sfx('plant');bounce(b);closeModal();save();refresh()}
function upgradeField(b){if(lvl()<UP.lvl||S.coins<UP.cost||S.wood<UP.wd||S.stone<UP.sn){toast('Gerekli: '+UP.cost+'🪙 '+UP.wd+'🪵 '+UP.sn+'🪨, seviye '+UP.lvl);sfx('err');return}
  S.coins-=UP.cost;S.wood-=UP.wd;S.stone-=UP.sn;b.lvl=2;stat('upgrade',1);toast('Toprak geliştirildi! Artık 2 kat ürün.');sfx('unlock');bounce(b);closeModal();save();refresh()}
function buy(key){const d=B[key];if(S.coins<d.cost||S.wood<d.wd||S.stone<d.sn){toast('Yetmiyor');sfx('err');return}
  const b={id:S.nid,type:key,x:0,y:0,st:0,end:0,dur:0,crop:0,lvl:1};const cells=[];for(const k of S.plots){const[px,py]=parse(k);for(let x=0;x<P;x++)for(let y=0;y<P;y++)cells.push([px*P+x,py*P+y])}
  cells.sort((a,c)=>Math.hypot(a[0]-cam.x,a[1]-cam.y)-Math.hypot(c[0]-cam.x,c[1]-cam.y));
  for(const[x,y]of cells)if(canPlace(b,x,y)){b.x=x;b.y=y;S.nid++;S.coins-=d.cost;S.wood-=d.wd;S.stone-=d.sn;S.b.push(b);if(d.kind==='decor'){stat('decor',1);addXP(2)}
    closeSheet();bounce(b);toast(d.e+' '+d.n+' kuruldu. Taşımak için basılı tut.');sfx('pop');save();refresh();return}
  toast('Yer yok, yeni arazi aç.');sfx('err')}
function sellBuilding(b){const d=B[b.type];if(d.kind==='home'){toast('Evini satamazsın!');return}
  if(b.type==='tarla'&&S.b.filter(o=>o.type==='tarla').length<=1){toast('Son tarlanı satamazsın');return}
  S.b=S.b.filter(o=>o!==b);S.coins+=Math.floor(d.cost/2);S.wood+=Math.floor(d.wd/2);S.stone+=Math.floor(d.sn/2);toast(d.n+' satıldı');sfx('coin');closeModal();save();refresh()}
function unlockPlot(k){const c=plotCost();if(S.coins<c){toast('Altın yetmiyor');sfx('err');return}
  S.coins-=c;S.plots.push(k);const[px,py]=parse(k);let t=0,r=0;for(let x=0;x<P;x++)for(let y=0;y<P;y++){const h=hash(px*P+x,py*P+y);if(h<.6)t++;else if(h<.78)r++}
  const gw=isBeach(px,py)?2:t+3,gs=r+2;S.wood+=gw;S.stone+=gs;REV=revealed();forestSel=null;addXP(10);toast('Yeni arazi! +'+gw+'🪵 +'+gs+'🪨');sfx('unlock');save();refresh()}
/* siparişler */
function makeOrder(allowTeaser){const prod=[...producible()];if(!prod.length)prod.push(BUG);
  if(allowTeaser&&Math.random()<.3){const own=new Set(S.b.map(b=>b.type));let best=null;for(const[k,d]of Object.entries(B)){if(own.has(k)||d.lvl>lvl()||(d.kind!=='animal'&&d.kind!=='factory'))continue;if(d.inp.some((v,i)=>v&&!prod.includes(i)))continue;if(!d.outp.some((v,i)=>v&&!prod.includes(i)))continue;if(!best||d.cost<best.cost)best=Object.assign({key:k},d)}
    if(best){const k=best.outp.findIndex(v=>v>0);const need=new Array(NI).fill(0);need[k]=ITEMS[k].p>30?1:2;return{id:Math.random().toString(36).slice(2),who:pick(NAMES),need,coins:Math.round(ITEMS[k].p*need[k]*1.8)+15,xp:ITEMS[k].xp*need[k]*3+5,teaser:best.n}}}
  const n=Math.min(prod.length,rnd(1,lvl()>=4?3:2));const need=new Array(NI).fill(0);let types=0,g=0;
  while(types<n&&g++<60){const k=pick(prod);if(need[k])continue;const p=ITEMS[k].p;need[k]=p<=8?rnd(3,8):p<=32?rnd(2,5):rnd(1,2);types++}
  const val=need.reduce((a,v,i)=>a+v*ITEMS[i].p,0),xp=need.reduce((a,v,i)=>a+v*ITEMS[i].xp,0);
  return{id:Math.random().toString(36).slice(2),who:pick(NAMES),need,coins:Math.round(val*1.25)+4,xp:Math.round(xp*1.4)+2}}
function fillOrders(){const prod=producible();S.orders=S.orders.filter(o=>o.teaser||o.need.every((v,i)=>!v||prod.has(i)));while(S.orders.length<3)S.orders.push(makeOrder(!S.orders.some(o=>o.teaser)))}
function deliver(o){if(!has(o.need))return;take(o.need);S.coins+=o.coins;S.orders=S.orders.filter(x=>x!==o);addXP(o.xp);trackDaily('order',0,1);stat('orders',1);fillOrders();toast(o.who+' çok memnun! +'+o.coins+'🪙');sfx('coin');save();refresh()}
function swapOrder(o){const i=S.orders.indexOf(o);S.orders.splice(i,1);S.orders.splice(i,0,makeOrder(!S.orders.some(x=>x.teaser)));save();refresh()}
function sell(k,n){n=Math.min(n,S.inv[k]);if(!n)return;S.inv[k]-=n;S.coins+=ITEMS[k].p*n;trackDaily('sell',0,n);toast(n+' '+ITEMS[k].e+' satıldı, +'+ITEMS[k].p*n+'🪙');sfx('coin');save();refresh()}
function capUp(){const c=S.cap*3,w=Math.floor(S.cap/4),s=Math.floor(S.cap/8);if(S.coins<c||S.wood<w||S.stone<s){toast('Gerekli: '+c+'🪙 '+w+'🪵 '+s+'🪨');sfx('err');return}S.coins-=c;S.wood-=w;S.stone-=s;S.cap+=20;toast('Ambar büyüdü: '+S.cap);sfx('unlock');save();refresh()}
/* tekne ve balık */
function newCrates(){const prod=[...producible()];const used=new Set();S.boat.crates=[];for(let i=0;i<3;i++){let k=pick(prod);let g=0;while(used.has(k)&&g++<20)k=pick(prod);used.add(k);const p=ITEMS[k].p;const q=Math.max(1,Math.min(10,Math.round((60+Math.random()*60)/p)));S.boat.crates.push({item:k,qty:q,done:false,coins:Math.round(p*q*1.6)+10,xp:ITEMS[k].xp*q*2+3})}}
function updateBoat(){if(lvl()<2)return;const n=now(),bt=S.boat;if(bt.st===0){if(!bt.at)bt.at=n+20000;if(n>=bt.at){newCrates();bt.st=1;bt.at=n+15*60000;if(started)toast('⛵ Tekne limana yanaştı!');save()}}else if(n>=bt.at){bt.st=0;bt.at=n+5*60000;bt.crates=[];save()}}
function fillCrate(c){if(c.done)return;if(S.inv[c.item]<c.qty){toast(c.qty+' '+ITEMS[c.item].e+' lazım');sfx('err');return}S.inv[c.item]-=c.qty;c.done=true;S.coins+=c.coins;addXP(c.xp);sfx('coin');
  if(S.boat.crates.every(x=>x.done)){const bonusC=Math.round(S.boat.crates.reduce((a,x)=>a+x.coins,0)*.3);S.coins+=bonusC;S.wood+=5;S.stone+=3;stat('boats',1);toast('Tekne dolu! Bonus +'+bonusC+'🪙 +5🪵 +3🪨');S.boat.at=now()+2500}else toast('Kasa yüklendi +'+c.coins+'🪙');save();refresh();openHarbor(true)}
let fish={st:0,bite:0,t:0,msg:''};
function cast(){if(lvl()<2){toast('Balık tutma seviye 2\'de açılır');return}if(total()>=S.cap){toast('Ambar dolu!');return}fish.st=1;fish.bite=performance.now()+1600+Math.random()*2900;fish.msg='';sfx('plant');renderFish()}
function reel(){if(fish.st===1){fish.st=0;fish.msg='Çok erken çektin, balık kaçtı.';sfx('err')}else if(fish.st===2){const n=Math.random()<.2?2:1;S.inv[BALIK]+=n;stat('fish',n);addXP(2*n);fish.st=0;fish.msg='+'+n+' 🐟 Harika!';sfx('coin');save();refresh()}renderFish()}
function updateFish(){const t=performance.now();if(fish.st===1&&t>=fish.bite){fish.st=2;fish.t=t;sfx('pop');renderFish()}else if(fish.st===2&&t>fish.t+950){fish.st=0;fish.msg='Balık kaçtı! Daha hızlı çek.';renderFish()}}

function upgradeHome(){const h=home();const l=homeLvl();if(l>=3)return;const n=l+1;if(lvl()<HOME_LVL[n]||S.coins<HOME_COST[n]||S.wood<HOME_WOOD[n]||S.stone<HOME_STONE[n]){toast('Yetmiyor');sfx('err');return}
  S.coins-=HOME_COST[n];S.wood-=HOME_WOOD[n];S.stone-=HOME_STONE[n];h.lvl=n;S.cap+=25;bounce(h);toast('Evin artık bir '+HOME_NAME[n]+'! Ambar +25');sfx('unlock');save();refresh();openHome()}

  S.inv[BALIK]--;S.catFed=now();let g;if(Math.random()<.6){const c=rnd(15,40);S.coins+=c;g=c+'🪙'}else{const w=rnd(3,5);S.wood+=w;g=w+'🪵'}petCat();toast('Tarçın balığa bayıldı! Sana '+g+' getirdi.');save();refresh();openHome()}

function updateDebris(){const n=now();if(n<S.nextDebris)return;const due=S.nextDebris<=0?2:1+Math.min(6,Math.floor((n-S.nextDebris)/150000));S.nextDebris=n+150000;const max=Math.min(8,2+S.plots.length);
  for(let i=0;i<due&&S.debris.length<max;i++){const f=freeCells().filter(([x,y])=>!(home()&&x>=home().x&&x<home().x+3&&y>=home().y&&y<home().y+3));if(!f.length)break;const[x,y]=pick(f);S.debris.push({id:S.nid++,x,y,kind:Math.random()<.6?0:1})}save()}
function clearDebris(r){const w=r.kind===0?rnd(2,4):0,s=r.kind===1?rnd(2,3):rnd(0,1);S.wood+=w;S.stone+=s;S.debris=S.debris.filter(x=>x!==r);addXP(2);trackDaily('clear',0,1);floatText(r.x+.5,r.y+.5,(w?'+'+w+'🪵 ':'')+(s?'+'+s+'🪨':''));sfx('pop');save();refresh()}

const today=()=>new Date().toISOString().slice(0,10), yesterday=()=>new Date(Date.now()-864e5).toISOString().slice(0,10);
const STREAK=[[30,0,0],[50,0,0],[70,10,0],[100,0,0],[130,0,8],[170,0,0],[250,15,10]];
function makeDaily(){const raw=[...producible()].filter(k=>k<=BAL);if(!raw.length)raw.push(BUG);const types=['plant','order','sell','clear'].sort(()=>Math.random()-.5);const l=lvl();
  S.daily=['collect',types[0],types[1]].map(t=>{const d={type:t,item:0,need:0,have:0,coins:40+l*12+rnd(0,30),xp:10+l*3,claimed:false};
    if(t==='collect'){d.item=pick(raw);const p=ITEMS[d.item].p;d.need=p<=8?rnd(10,16):p<=18?rnd(6,10):rnd(3,5)}else d.need={plant:rnd(5,8),order:rnd(2,4),sell:rnd(10,20),clear:rnd(2,3)}[t];return d})}
function trackDaily(t,item,n){for(const d of S.daily){if(d.claimed||d.type!==t||(t==='collect'&&d.item!==item))continue;const was=d.have>=d.need;d.have=Math.min(d.need,d.have+n);if(!was&&d.have>=d.need)toast('Günlük görev tamam: '+dailyText(d))}}
const dailyText=d=>({collect:d.need+' '+ITEMS[d.item].e+' topla',plant:d.need+' kez ekim yap',order:d.need+' sipariş teslim et',sell:'Pazarda '+d.need+' ürün sat',clear:d.need+' kütük/kaya temizle'})[d.type];
function checkDaily(){if(S.dailyDate!==today()){S.dailyDate=today();makeDaily();save()}if(started&&S.lastDaily!==today()&&!modalOpen())openDailyGift()}
function claimGift(){if(S.lastDaily===today())return;S.streak=S.lastDaily===yesterday()?S.streak+1:1;S.lastDaily=today();const g=STREAK[(S.streak-1)%7];S.coins+=g[0];S.wood+=g[1];S.stone+=g[2];toast('Günlük hediye: +'+g[0]+'🪙'+(g[1]?' +'+g[1]+'🪵':'')+(g[2]?' +'+g[2]+'🪨':''));sfx('unlock');closeModal();save();refresh()}

let night=0,warm=0,phaseIdx=0,phaseLeft=0,season=0,weather=0,weatherDim=0;
function updateTime(dt){const ph=(now()/1000%600)/600;phaseIdx=0;while(phaseIdx<3&&ph>=PH_END[phaseIdx])phaseIdx++;const st=phaseIdx?PH_END[phaseIdx-1]:0,u=(ph-st)/(PH_END[phaseIdx]-st);phaseLeft=(PH_END[phaseIdx]-ph)*600;
  const sm=u=>u*u*(3-2*u);[night,warm]=[[0,0],[sm(u),Math.sin(u*Math.PI)],[1,0],[1-sm(u),Math.sin(u*Math.PI)*.7]][phaseIdx];
  const s=Math.floor(now()/1000/1200)%4;if(s!==season){season=s;if(started)toast(SEASON_E[s]+' '+SEASON_NAME[s]+' geldi!')}
  const slot=Math.floor(now()/1000/150),h=hash(slot%100000,7,3);const w=season===3?(h<.6?2:0):h<[.35,.12,.45][season]?1:0;if(w!==weather){weather=w;if(started&&w===1)toast('🌧️ Yağmur başladı, tarlalar daha hızlı büyüyor.');if(started&&w===2)toast('❄️ Kar yağıyor...')}
  weatherDim+=Math.sign((weather?1:0)-weatherDim)*Math.min(Math.abs((weather?1:0)-weatherDim),dt*.4)}
const seasonFactor=()=>(season===0?.9:season===3?1.25:1)*(weather===1?.85:1);

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,TW=64,TH=32,K=1;
const cam={x:4,y:4,zoom:1};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
function setScale(){const base=Math.min(W/(W>H?11:7.5),H/7.5);TW=Math.max(28,base*cam.zoom);TH=TW/2;K=TW/64}
const iso=(x,y)=>({x:W/2+((x-cam.x)-(y-cam.y))*TW/2,y:H/2+((x-cam.x)+(y-cam.y))*TH/2+TH*.6});
const cellAt=(sx,sy)=>{const a=(sx-W/2)/(TW/2),b=(sy-H/2-TH*.6)/(TH/2);return{x:cam.x+(a+b)/2,y:cam.y+(b-a)/2}};
const OUT='rgba(74,44,18,.45)';
function poly(pts,fill,stroke=OUT,lw=1){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
const up=(p,z)=>({x:p.x,y:p.y-z});
const quad=(x,y,w,h)=>[iso(x,y),iso(x+w,y),iso(x+w,y+h),iso(x,y+h)];
function box(x,y,w,h,z,top,l,r){const[a,b,c,d]=quad(x,y,w,h);poly([d,c,up(c,z),up(d,z)],l);poly([c,b,up(b,z),up(c,z)],r);if(top)poly([a,b,c,d].map(p=>up(p,z)),top)}
function roof(x,y,w,h,z,rh,cl,cr,o=.08){const[a,b,c,d]=quad(x-o,y-o,w+2*o,h+2*o).map(p=>up(p,z));const ap=up(iso(x+w/2,y+h/2),z+rh);poly([a,b,ap],cr);poly([a,d,ap],cl);poly([d,c,ap],cl);poly([c,b,ap],cr)}
function ell(x,y,rx,ry,fill,stroke=OUT,lw=1){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
const shadow=(x,y,r)=>ell(x,y,r,r*.45,'rgba(40,60,20,.2)',null);
function emoji(t,x,y,s){ctx.font=s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=(pa>>16)+((pb>>16)-(pa>>16))*t,g=(pa>>8&255)+((pb>>8&255)-(pa>>8&255))*t,bl=(pa&255)+((pb&255)-(pa&255))*t;return'rgb('+(r|0)+','+(g|0)+','+(bl|0)+')'}
const toHex=c=>{if(c[0]==='#')return c;const m=c.match(/\d+/g);return'#'+m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('')};
const haze=(c,h)=>h?mix(toHex(c),'#dceedc',h):c;
function grassCol(alt,own){const pal=own?[['#93d455','#8acb4c'],['#a3d04a','#99c742'],['#c9bf5c','#bfb553'],['#eef3f6','#e4ecf1']]:[['#6fa84a','#69a044'],['#79a343','#739c3d'],['#a8a050','#a0974a'],['#e3eaee','#dbe3e8']];return pal[season][alt?0:1]}
function leafCol(c,v,hz){let r=c;if(season===1)r=mix(c,'#3f8a2a',.25);else if(season===2)r=mix(['#e8892f','#d9622b','#f2b33d'][v%3],c,.15);else if(season===3)r=mix(c,'#f4f8fb',.8);return haze(toHex(r),hz)}

function drawWater(t){const sea=mixSea();ctx.fillStyle=sea;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.lineCap='round';
  for(let i=0;i<30;i++){const x=(hash(i,1)*W*1.3+t*12*(.5+hash(i,2)))%(W+80)-40,y=hash(i,3)*H,w=10+hash(i,4)*22;ctx.globalAlpha=.3+.3*Math.sin(t*1.5+i);ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+w/2,y-4,x+w,y);ctx.stroke()}ctx.globalAlpha=1}
function mixSea(){let c=mix('#5ec2dd','#173a63',night);c=mix(toHex(c),'#e9a27a',warm*.35);c=mix(toHex(c),'#7d8f99',weatherDim*.4);if(season===3)c=mix(toHex(c),'#9fc6d6',.25*(1-night));return c}

function plotVisible(px,py){const a=iso(px*P,py*P),b=iso(px*P+P,py*P),c=iso(px*P+P,py*P+P),d=iso(px*P,py*P+P);return Math.max(a.x,b.x,c.x,d.x)>-40&&Math.min(a.x,b.x,c.x,d.x)<W+40&&Math.max(a.y,b.y,c.y,d.y)>-60&&Math.min(a.y,b.y,c.y,d.y)<H+120}
function drawGround(drawables){const keys=[...REV].map(parse).sort((a,b)=>a[0]+a[1]-b[0]-b[1]);const D=TH*1.25;
  for(const[px,py]of keys){if(!plotVisible(px,py))continue;const k=pkey(px,py),own=S.plots.includes(k),beach=isBeach(px,py);const hz=own?0:(beach?.3:.42);
    const x0=px*P,y0=py*P;
    if(!REV.has(pkey(px,py+1))){const a=iso(x0,y0+P),b=iso(x0+P,y0+P);poly([a,b,up(b,-D),up(a,-D)],haze(beach?'#e3c88f':'#b47c45',hz*.5),null);poly([a,b,up(b,-D*.22),up(a,-D*.22)],haze(beach?'#efdca0':(season===3?'#e8eef2':'#6aa83e'),hz*.5),null)}
    if(!REV.has(pkey(px+1,py))){const a=iso(x0+P,y0),b=iso(x0+P,y0+P);poly([b,a,up(a,-D),up(b,-D)],haze(beach?'#d8bb80':'#9a6533',hz*.5),null);poly([b,a,up(a,-D*.22),up(b,-D*.22)],haze(beach?'#e6d293':(season===3?'#dde5ea':'#5a9434'),hz*.5),null)}
    for(let x=0;x<P;x++)for(let y=0;y<P;y++){const gx=x0+x,gy=y0+y,alt=((gx+gy)%2+2)%2===1;
      let col;if(beach){const wet=x+y>=6&&!REV.has(pkey(px+1,py))&&!REV.has(pkey(px,py+1));col=wet?(alt?'#e2c98a':'#dbc080'):(alt?'#f4e2ad':'#efd99d');if(season===3)col=mix(col,'#f2f5f7',.5)}else col=grassCol(alt,own);
      poly(quad(gx,gy,1,1),haze(toHex(col),hz),null);
      if(own)continue;const h=hash(gx,gy,beach?21:0),pos=[gx+.5+(hash(gx,gy,2)-.5)*.4,gy+.5+(hash(gx,gy,3)-.5)*.4];
      if(beach){if(h<.2)drawables.push({d:pos[0]+pos[1],f:()=>palm(pos[0],pos[1],.85+hash(gx,gy,4)*.35,hz)});else if(h>.9)drawables.push({d:pos[0]+pos[1],f:()=>{const p=iso(...pos);ell(p.x,p.y-2*K,5*K,3*K,haze(hash(gx,gy,6)>.5?'#ffb3a0':'#fff1e0',hz))}})}
      else{if(h<.6)drawables.push({d:pos[0]+pos[1],f:()=>tree(pos[0],pos[1],.8+hash(gx,gy,4)*.45,hash(gx,gy,1),hz)});else if(h<.78)drawables.push({d:pos[0]+pos[1],f:()=>bush(pos[0],pos[1],hash(gx,gy,5),hz)})}}
    if(forestSel===k){ctx.globalAlpha=.35+.15*Math.sin(performance.now()/200);poly(quad(x0,y0,P,P),null,'#fff',3);ctx.globalAlpha=1}}}
function tree(x,y,s,kind,hz){const p=iso(x,y);shadow(p.x,p.y,13*K*s);ctx.fillStyle=haze('#8a5a32',hz);ctx.fillRect(p.x-2.5*K*s,p.y-12*K*s,5*K*s,12*K*s);
  if(kind<.3){['#3f8f3a','#4fa543','#62b84f'].forEach((c,i)=>poly([{x:p.x-(14-i*3)*K*s,y:p.y-(10+i*9)*K*s},{x:p.x+(14-i*3)*K*s,y:p.y-(10+i*9)*K*s},{x:p.x,y:p.y-(30+i*9)*K*s}],season===3?haze(mix(c,'#f4f8fb',.45),hz):haze(c,hz)))}
  else{const v=Math.floor(kind*7);ell(p.x,p.y-24*K*s,14*K*s,13*K*s,leafCol('#5cb345',v,hz));ell(p.x-5*K*s,p.y-28*K*s,9*K*s,8*K*s,leafCol('#6cc452',v+1,hz),null);ell(p.x+4*K*s,p.y-31*K*s,6*K*s,5*K*s,leafCol('#82d562',v+2,hz),null)}}
function bush(x,y,k,hz){const p=iso(x,y);ell(p.x,p.y-5*K,11*K,7*K,leafCol('#4fa543',Math.floor(k*5),hz));ell(p.x+4*K,p.y-7*K,6*K,5*K,leafCol('#62b84f',1,hz),null);if(k>.5&&season<=1){ell(p.x-3*K,p.y-10*K,2*K,2*K,haze('#ff7aa8',hz),null)}}
function palm(x,y,s,hz){const p=iso(x,y);shadow(p.x,p.y,12*K*s);ctx.strokeStyle=haze('#b8895a',hz);ctx.lineWidth=5*K*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.quadraticCurveTo(p.x+6*K*s,p.y-20*K*s,p.x+4*K*s,p.y-42*K*s);ctx.stroke();
  const tx=p.x+4*K*s,ty=p.y-42*K*s;for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.strokeStyle=leafCol(i%2?'#4ea83a':'#5fbf45',i,hz);ctx.lineWidth=5*K*s;ctx.beginPath();ctx.moveTo(tx,ty);ctx.quadraticCurveTo(tx+Math.cos(a)*14*K*s,ty+Math.sin(a)*5*K*s-8*K*s,tx+Math.cos(a)*22*K*s,ty+Math.sin(a)*9*K*s+4*K*s);ctx.stroke()}ell(tx,ty+3*K*s,3*K*s,3*K*s,haze('#7a5030',hz),null)}

const herds=new Map(),bounces=new Map();let wellShow=null;
function bounce(b){bounces.set(b.id,performance.now())}
function growth(b){return b.st===2?1:b.st===1?Math.min(1,Math.max(0,1-(b.end-now())/(b.dur*1000))):0}
function fence(x,y,w,h,edges){const hp=TW*.15,[a,b,c,d]=quad(x,y,w,h),E={ab:[a,b],ad:[a,d],dc:[d,c],cb:[c,b]};ctx.lineCap='round';
  for(const e of edges){const[p,q]=E[e],n=Math.max(2,Math.round(Math.hypot(q.x-p.x,q.y-p.y)/(TW*.28)));ctx.strokeStyle='#c8935a';ctx.lineWidth=2*K+.6;ctx.beginPath();for(const r of[.45,.85]){ctx.moveTo(p.x,p.y-hp*r);ctx.lineTo(q.x,q.y-hp*r)}ctx.stroke();
    ctx.strokeStyle='#a0683a';ctx.lineWidth=2.6*K+.6;ctx.beginPath();for(let i=0;i<=n;i++){const u=i/n,px=p.x+(q.x-p.x)*u,py=p.y+(q.y-p.y)*u;ctx.moveTo(px,py);ctx.lineTo(px,py-hp)}ctx.stroke()}}

  if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.zoom};downInfo=null;clearTimeout(longT);return}
  downInfo={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,t:performance.now(),moved:false};const b=buildingAt(e.clientX,e.clientY);

  if(pinch&&pts.size>=2){const[a,b]=[...pts.values()];cam.zoom=Math.max(.55,Math.min(1.8,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));return}
  if(drag){const c=cellAt(e.clientX,e.clientY);drag.nx=Math.floor(c.x)-drag.gx;drag.ny=Math.floor(c.y)-drag.gy;drag.ok=canPlace(drag.b,drag.nx,drag.ny);return}
  if(!downInfo||!started)return;const dx=e.clientX-downInfo.x,dy=e.clientY-downInfo.y;if(!downInfo.moved&&Math.hypot(dx,dy)>9){downInfo.moved=true;clearTimeout(longT)}
  if(downInfo.moved){const a=dx/(TW/2),b=dy/(TH/2);cam.x=downInfo.cx-(a+b)/2;cam.y=downInfo.cy-(b-a)/2;clampCam()}});

  if(drag){if(drag.ok&&(drag.nx!==drag.b.x||drag.ny!==drag.b.y)){drag.b.x=drag.nx;drag.b.y=drag.ny;bounce(drag.b);sfx('tap');save()}else if(!drag.ok)toast('Oraya sığmıyor');drag=null;return}

  STREAK.forEach((g,i)=>{h+='<div class="day '+(i===cur?'cur':i<cur?'past':'')+'">Gün '+(i+1)+'<div class="e" style="font-size:20px">'+(i===6?'🎁':'🪙')+'</div>'+g[0]+(g[1]?'<br>+'+g[1]+'🪵':'')+(g[2]?'<br>+'+g[2]+'🪨':'')+'</div>'});
  h+='</div><button class="btn" id="claimG" style="font-size:18px;padding:10px">Hediyeyi Al!</button>';openModal(h);$('claimG').onclick=claimGift}
function openSettings(){modalKind='set';openModal(head('⚙️','Ayarlar')+'<div class="row"><div class="txt t1">Sesler</div><button class="btn '+(S.muted?'alt':'')+'" id="mute">'+(S.muted?'Kapalı':'Açık')+'</button></div><div class="row"><div class="txt t1">Çiftliği sıfırla</div><button class="btn red" id="rst">Sıfırla</button></div><p class="hint" style="text-align:center">Kare Köy · web prototipi v0.9</p>');
  $('mute').onclick=()=>{S.muted=!S.muted;save();openSettings()};$('rst').onclick=()=>{const b=$('rst');if(b.dataset.c){S=fresh();fillOrders();makeDaily();S.dailyDate=today();REV=revealed();computeHarbor();herds.clear();save();closeModal();refresh();toast('Yeni çiftlik kuruldu 🌱')}else{b.dataset.c=1;b.textContent='Emin misin? Evet'}}}
$('btnSettings').onclick=openSettings;

/* ---------------- ses ---------------- */
let AC=null;const audio={};
function audioUnlock(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(k){if(S.muted||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;const cfg={pop:[480,1300,.13,'sine'],tap:[760,760,.05,'sine'],plant:[300,160,.15,'triangle'],coin:[988,1319,.22,'square'],err:[160,140,.18,'square'],unlock:[523,1047,.4,'triangle']}[k]||[600,600,.1,'sine'];
  o.type=cfg[3];o.frequency.setValueAtTime(cfg[0],t);o.frequency.exponentialRampToValueAtTime(cfg[1],t+cfg[2]*.8);g.gain.setValueAtTime(k==='coin'||k==='err'?.05:.12,t);g.gain.exponentialRampToValueAtTime(.001,t+cfg[2]);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+cfg[2]+.02)}
function playAnimal(n){if(S.muted)return;try{const a=audio[n]||(audio[n]=new Audio(SND[n]));a.currentTime=0;a.volume=.8;a.play().catch(()=>{})}catch(e){}}

/* ---------------- açılış ---------------- */
let returning=load();
if(!home()){const h={id:S.nid++,type:'ev',x:0,y:0,lvl:1,st:0};for(let x=7;x>=-8&&!h.placed;x--)for(let y=7;y>=-8;y--)if(canPlace(h,x,y)){h.x=x;h.y=y;h.placed=1;break}if(h.placed){delete h.placed;S.b.push(h)}}
REV=revealed();computeHarbor();fillOrders();if(S.dailyDate!==today()){S.dailyDate=today();makeDaily()}
const vc=villageCenter();cam.x=vc.x;cam.y=vc.y;resize();addEventListener('resize',resize);refresh();
const tinfo=()=>{$('tinfo').textContent=SEASON_E[season]+' '+SEASON_NAME[season]+' · '+PH_NAME[phaseIdx]+' · Seviye '+lvl()};
$('play').onclick=()=>{audioUnlock();started=true;$('title').hidden=true;cam.zoom=1;const c=villageCenter();cam.x=c.x;cam.y=c.y;sfx('pop');
  const away=S.b.filter(b=>b.st===1&&now()>=b.end).length;toast(returning?(away?'Sen yokken '+away+' üretim tamamlandı!':'Tekrar hoş geldin!'):'🌱 Tarlaya dokun ve buğday ek!');
  if(!S.catMet){S.catMet=true;setTimeout(()=>toast('🐱 Kedin Tarçın köye geldi! Ona dokunup sevebilirsin.'),2800)}setTimeout(checkDaily,600);save()};
setInterval(()=>{let ch=false;for(const b of S.b)if(b.st===1&&now()>=b.end){b.st=2;ch=true}updateBoat();updateDebris();checkAch();if(ch){save();refresh()}updTime();tinfo();
  const bt=$('boatT');if(bt)bt.textContent=mmss((S.boat.at-now())/1000)},500);
setInterval(updateFish,50);setInterval(save,5000);setInterval(()=>{if(started)checkDaily()},10000);
updateTime(0);updTime();tinfo();requestAnimationFrame(frame);
